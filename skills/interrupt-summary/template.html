<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connect Interrupt Summary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Filled by bin/sift-interrupt-summary render. All content is static HTML/SVG filled into the double-brace slots; the script only adds hover tooltips. */
:root{
  --bg:#f7f8fa; --surface:#ffffff; --fg:#14171c; --fg2:#4d5562; --muted:#7a828f; --rule:#dfe3e9; --grid:#eceff3;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --display:"Fraunces",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1a1d21; --fg:#eef0f3; --fg2:#b9c0ca; --muted:#8a929e; --rule:#2c3138; --grid:#252a30;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1a1d21; --fg:#eef0f3; --fg2:#b9c0ca; --muted:#8a929e; --rule:#2c3138; --grid:#252a30;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-block:36px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,34px);line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
p{margin:0;max-width:68ch}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--fg2);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:20px;display:grid;gap:12px;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--fg2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.chart .tot{fill:var(--fg);font-size:12px;font-weight:500}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:150px;z-index:2}
.tip .row{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.tip .hd{font-weight:600;margin-bottom:4px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--grid)}
thead th{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule)}
td.n{font-family:var(--mono);text-align:right;white-space:nowrap;width:1%}
td.cat{font-weight:500;white-space:nowrap}
.bar{height:6px;border-radius:0 3px 3px 0;margin-top:6px}
.pct{color:var(--muted)}
.chart g.m{outline:none}
.chart.hov g.m{opacity:.45}
.chart.hov g.m.on{opacity:1}
td.what{color:var(--fg2);min-width:240px}
.foot{font-size:12px;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header style="display:grid;gap:10px">
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{TITLE}}</h1>
    {{HEADLINE}}
  </header>

  <section class="panel" aria-labelledby="m-h">
    <h2 id="m-h">Requests per month</h2>
    <div class="legend">{{LEGEND}}</div>
    <div class="chart" id="chart">{{CHART}}<div class="tip" id="tip" hidden></div></div>
    {{PARTIAL}}
  </section>

  <section class="panel" aria-labelledby="t-h">
    <h2 id="t-h">Task categories</h2>
    {{TASKS_NOTE}}
    <div class="scroll"><table>{{TASKS}}</table></div>
  </section>

  <section class="panel" aria-labelledby="b-h">
    <h2 id="b-h">Bug categories</h2>
    {{BUGS_NOTE}}
    <div class="scroll"><table>{{BUGS}}</table></div>
  </section>

  <section class="panel" aria-labelledby="s-h">
    <h2 id="s-h">Story themes</h2>
    {{STORIES_NOTE}}
    <div class="scroll"><table>{{STORIES}}</table></div>
  </section>

  {{FOOT}}
</div>

<script>
// Optional enhancement: hover/focus tooltips on the chart. The page is complete without it.
(()=>{const host=document.getElementById('chart'),tip=document.getElementById('tip'),svg=host.querySelector('svg');if(!svg)return;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
host.querySelectorAll('g.m').forEach(g=>{
  const show=()=>{tip.innerHTML='<div class="hd">'+esc(g.dataset.h)+'</div>'+g.dataset.t.split(' · ').map(x=>{const i=x.lastIndexOf(' ');return '<div class="row"><span>'+esc(x.slice(0,i))+'</span><b>'+esc(x.slice(i+1))+'</b></div>'}).join('');
    tip.hidden=false;const r=host.getBoundingClientRect(),b=g.querySelector('path,rect:not([fill=transparent])')||g.firstChild,bb=b.getBoundingClientRect();
    let left=bb.right-r.left+10;if(left+170>r.width)left=bb.left-r.left-10-tip.offsetWidth;tip.style.left=Math.max(0,left)+'px';tip.style.top=(bb.top-r.top)+'px';
    host.classList.add('hov');g.classList.add('on')};
  const hide=()=>{tip.hidden=true;host.classList.remove('hov');g.classList.remove('on')};
  g.addEventListener('mouseenter',show);g.addEventListener('focus',show);g.addEventListener('mouseleave',hide);g.addEventListener('blur',hide)})})();
</script>
</body>
</html>
